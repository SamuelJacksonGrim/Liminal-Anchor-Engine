[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liminal-anchor-engine"
version = "0.6.0"
description = "Transition-layer subsystem for adaptive cognitive systems: structures ambiguity, anchors continuity, and tracks identity as a gradient field."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Samuel Jackson Grim" }]
keywords = ["cognitive-architecture", "transitions", "identity", "ambiguity", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/SamuelJacksonGrim/Liminal-Anchor-Engine"

[tool.setuptools.packages.find]
include = ["lae*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
