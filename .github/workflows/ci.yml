name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run test suite
        run: pytest
      - name: Run examples (must complete without error)
        run: |
          python examples/demo.py
          python examples/minimal_agent_loop.py
          python examples/rfe_integration.py
          python examples/multi_mind_demo.py
          python examples/custom_hooks.py
